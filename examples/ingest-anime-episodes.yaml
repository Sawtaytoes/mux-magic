# Anime ingest — the basic mux-magic sequence
# =============================================================================
# Names episodes from AniDB, trims to JP audio + English subs, applies the
# default subtitle rules, re-muxes, and moves the result into the Plex library.
#
# This is the MOST BASIC ingest — it only "pushes up" the subtitles. Some
# releases additionally need an audio or subtitle TRACK SWAP from another source
# (see the runbook "Variations" section); this flow does not.
#
# Load at https://mux-magic.octen.dev → "Load YAML" → Run on Server.
#
# PATHS ARE CONTAINER PATHS (/media/...), which differ from the on-disk NAS paths
# (/mnt/Bunnies/Family/...). Work on COPIES in a `work/` folder; keep pristine
# originals elsewhere.

variables:
  workDir:
    label: Working Directory
    value: /media/Downloads/~ANIME/<Series>/work
    type: path
  anidbId:
    label: aniDB ID
    value: '<aid>'
    type: anidbId
  outputDir:
    label: Output Directory
    value: /media/Anime/<Series> [anidb-<aid>]
    type: path

steps:
  # 1. Name episodes from AniDB → "<Series> - sNNeNN - <title>".
  #    For a PARTIAL set (e.g. E05–E12), a plain run index-pairs from episode 1
  #    and misnumbers them. Two options for partial/non-contiguous sets:
  #      • filenameRegex: 'S\d+E(?<episodeNumber>\d+)'  — pair each file to the
  #        episode number in its name (handles gaps and out-of-order too), or
  #      • startEpisodeNumber: 5  — begin index pairing at episode 5.
  #    Match the existing library's naming exactly (it is the naming authority).
  - id: nameEpisodes
    command: nameAnimeEpisodesAniDB
    params: {sourcePath: '@workDir', anidbId: '@anidbId'}

  # 2. Keep only JP audio + English subs (drops other languages). Fonts/
  #    attachments are retained — keepLanguages only filters audio/subtitle tracks.
  - id: keepLangs
    command: keepLanguages
    params: {sourcePath: '@workDir', audioLanguages: [jpn], subtitlesLanguages: [eng]}

  # 3. Move the trimmed output back onto workDir. Use flattenOutput (an instant
  #    move that safely swallows the chmod/rename error copyFiles trips on with
  #    "Refusing to overwrite existing destination"), NOT copyFiles.
  - id: flatten
    command: flattenOutput
    params: {sourcePath: {linkedTo: keepLangs, output: folder}, deleteSourceFolder: true}

  # 4. Extract the English .ass (extractSubtitles — copyOutSubtitles is
  #    deprecated), then prune anything non-.ass.
  - id: extractSubs
    command: extractSubtitles
    params: {sourcePath: '@workDir'}
  - id: pruneSubs
    command: deleteFilesByExtension
    params: {sourcePath: {linkedTo: extractSubs, output: folder}, extensions: [idx, vob, srt], isRecursive: true}

  # 5. Default subtitle rules: ScriptType v4.00+, YCbCr TV.709, fixes narrow
  #    margins, and scales MarginV (vheight) to 90 at 1080p while protecting signs
  #    & songs. No explicit MarginV rule needed — it's part of the defaults.
  - id: modifySubs
    command: modifySubtitleMetadata
    params: {sourcePath: {linkedTo: extractSubs, output: folder}, isRecursive: true, hasDefaultRules: true}

  # 6. Re-mux the modified subs back in — drops the stale embedded sub (no
  #    duplicate), keeps video, audio, chapters, and embedded fonts.
  - id: mergeBack
    command: addSubtitles
    params: {sourcePath: '@workDir', subtitlesPath: {linkedTo: extractSubs, output: folder}}

  # 7. Move the finished files into the Plex library.
  - id: moveToLibrary
    command: moveFiles
    params: {sourcePath: {linkedTo: mergeBack, output: folder}, destinationPath: '@outputDir'}
