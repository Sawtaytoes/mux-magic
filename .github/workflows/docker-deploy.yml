name: Docker Deploy

on:
  workflow_run:
    workflows: ["CI"]
    branches:
      - master
      - "feat/**"
    types: [completed]

# Group by the branch that actually ran CI, not github.ref — under a
# workflow_run trigger github.ref is always the default branch, which
# would lump every feat/** deploy into one queue with master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref }}

jobs:
  # Did CI actually run its gates, or did it skip them?
  #
  # CI skips every gate when the diff is documentation only, and mux-magic's
  # also skips when this exact SHA already had a green run. In BOTH cases the
  # workflow concludes `success`, so the `conclusion == 'success'` test below
  # is true and this deploy used to rebuild and push an image for a change
  # that could not alter it -- churning the mutable `latest` tag for nothing.
  #
  # Asking CI what it did is more reliable than re-deriving the diff here. A
  # `workflow_run` payload carries no `before` SHA, so this workflow cannot
  # see the range that CI saw -- only the head commit.
  changes:
    runs-on: ubuntu-latest

    permissions:
      actions: read

    outputs:
      didCiRun: ${{ steps.detect.outputs.didCiRun }}

    steps:
      - id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail

          # Fails SAFE: a manual dispatch has no upstream run to inspect, so
          # it builds.
          if [ "$EVENT" != "workflow_run" ] || [ -z "${RUN_ID:-}" ]
          then
            echo "Not a workflow_run trigger -- building."
            echo "didCiRun=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          conclusion="$(gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs" \
            --jq '[.jobs[] | select(.name == "lint")] | first | .conclusion // "unknown"')"
          echo "CI job 'lint' concluded: ${conclusion}"

          if [ "${conclusion}" = "skipped" ]
          then
            echo "CI skipped its gates -- nothing new to build."
            echo "didCiRun=false" >> "$GITHUB_OUTPUT"
          else
            echo "didCiRun=true" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [changes]
    # `!= 'false'` not `== 'true'`: if the `changes` job itself fails,
    # the output is empty and this still builds.
    if: ${{ needs.changes.outputs.didCiRun != 'false' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    # ci.yml bounds every one of its jobs (its #226); this workflow had no
    # bound at all, so a wedged `docker build` could hold GitHub's 6-hour
    # ceiling AND this branch's concurrency slot for the whole time. Observed
    # green is ~6.5-7min (the image compiles MakeMKV and runs a build-time
    # assertion against it), so 30 is a ceiling, not a target.
    timeout-minutes: 30
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@master
        with:
          # workflow_run's github.sha resolves to the DEFAULT branch (master),
          # not the branch that ran CI — so building feat/** here used to
          # produce a feat-tagged image containing master's code. Use the
          # triggering run's head_sha so the image matches its tag.
          ref: "${{ github.event.workflow_run.head_sha || github.sha }}"

      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: corepack enable && yarn install --immutable

      - name: Build @mux-magic/tools
        # generate:schemas-ci runs under tsx, which resolves bare
        # `@mux-magic/tools` imports via the package's "default" export
        # (./dist/index.js) — tsx doesn't claim the "source" condition
        # that Vite/vitest use. Without this step the next command dies
        # with ERR_MODULE_NOT_FOUND on the first `import "@mux-magic/tools"`.
        # Mirrors the unit-tests / e2e / typecheck jobs in ci.yml.
        run: yarn build:tools

      - name: Generate OpenAPI schemas
        run: yarn generate:schemas-ci

      - name: Capture build time
        id: meta
        run: echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Compute branch tag
        id: tags
        run: |
          branch_tag="${{ github.event.workflow_run.head_branch }}"
          branch_tag="${branch_tag//\//-}"
          echo "branch_tag=${branch_tag}" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          build-args: |
            GIT_SHA=${{ github.event.workflow_run.head_sha || github.sha }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
          tags: |
            ghcr.io/sawtaytoes/mux-magic:${{ github.event.workflow_run.head_sha || github.sha }}
            ghcr.io/sawtaytoes/mux-magic:${{ steps.tags.outputs.branch_tag }}
            ${{ github.event.workflow_run.head_branch == 'master' && 'ghcr.io/sawtaytoes/mux-magic:latest' || '' }}
