# Watch ghcr.io/jlesage/makemkv for a newer tag and open a PR bumping the
# Dockerfile's `FROM` pin.
#
# What this is NOT — corrected 2026-08-21, after the first real run.
#
# This header used to say: MakeMKV refuses to run once its beta key expires,
# the key rotates monthly, so a stale image turns into "the analyser returns
# no titles". The expiry is real. Its connection to this workflow is not, and
# reading it that way makes a bump look like insurance it does not provide.
#
#   * The key is `app_Key` in the MOUNTED HOST CONFIG —
#     App-Configs/mux-magic/makemkv/.MakeMKV/settings.conf — not in the image.
#     Nothing this workflow does can rotate it; that file is edited by hand.
#   * These tags are jlesage's OWN image version (their only version label is
#     `org.label-schema.version`, e.g. `26.08.2`) and say nothing about which
#     MakeMKV is inside. v26.07.2 and v26.08.2 both ship MakeMKV v1.18.4.
#
# So treat a bump as what it is: a base-layer refresh that keeps the pin from
# drifting. When the key does expire, the fix is settings.conf — plus, maybe,
# a jlesage tag that genuinely carries a newer MakeMKV. Check that version
# inside the image; do not infer it from the tag.
#
# The PR this opens is NOT verified by CI. Two separate reasons, both live:
#
#   * Nothing builds the Dockerfile on a PR. ci.yml has no Docker job, and
#     docker-deploy.yml triggers on `branches: [master, feat/**]`, which a
#     `chore/makemkv-*` branch does not match. The build-time MSG:1005
#     assertion below therefore runs AFTER the merge, never on the PR.
#   * GitHub does not trigger workflows from events raised by GITHUB_TOKEN, so
#     a PR opened by this workflow arrives with NO checks at all until a user
#     touches it — close+reopen, or push to the branch.
#
# Until those are fixed, verify a bump by hand before merging — build the
# transplant against the new tag and assert it starts:
#
#     FROM ghcr.io/jlesage/makemkv:<tag> AS makemkv
#     FROM node:26-trixie-slim
#     COPY --from=makemkv /opt/makemkv /opt/makemkv
#     ENV PATH="/opt/makemkv/bin:${PATH}"
#     RUN makemkvcon -r --cache=1 info disc:9999 | grep -q 'MSG:1005.*started'
#
# After the merge, docker-deploy pushes :master. The app runs
# `pull_policy: always`, so a redeploy picks the new image up — and performing
# that redeploy is the agent's job, not a handoff back to the owner.
#
# Caveat, stated here rather than rediscovered: jlesage's image lags
# upstream MakeMKV by days-to-weeks. If latest-day ever matters, the
# alternative is a build stage compiling makemkv-oss + makemkv-bin from
# makemkv.com/download — more control, more maintenance. Start with the tag.
name: MakeMKV Tag Watcher

on:
  schedule:
    # Weekly, Monday 06:00 UTC. The upstream cadence is monthly-ish, so
    # anything more frequent is just noise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  check-for-new-tag:
    # Two unbounded network calls (ghcr.io's token endpoint and its tag list).
    # `curl -fsSL` has no timeout of its own, so a hung mirror would park this
    # weekly job on GitHub's 6-hour ceiling.
    timeout-minutes: 10
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@master

      - name: Resolve the current and latest MakeMKV tags
        id: tags
        run: |
          set -euo pipefail

          current="$(grep -oP 'FROM ghcr\.io/jlesage/makemkv:\Kv[0-9.]+' Dockerfile | head -1)"
          if [ -z "$current" ]; then
            echo "::error::Could not read the MakeMKV tag out of the Dockerfile."
            exit 1
          fi

          # ghcr.io serves an anonymous pull token for public packages.
          token="$(curl -fsSL 'https://ghcr.io/token?scope=repository:jlesage/makemkv:pull&service=ghcr.io' | jq -r .token)"
          latest="$(
            curl -fsSL -H "Authorization: Bearer ${token}" \
              'https://ghcr.io/v2/jlesage/makemkv/tags/list' \
            | jq -r '.tags[]' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V \
            | tail -1
          )"

          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "Current: ${current}  Latest: ${latest}"

      - name: Bump the Dockerfile pin
        if: steps.tags.outputs.latest != steps.tags.outputs.current
        run: |
          set -euo pipefail
          sed -i \
            "s#FROM ghcr.io/jlesage/makemkv:${{ steps.tags.outputs.current }}#FROM ghcr.io/jlesage/makemkv:${{ steps.tags.outputs.latest }}#" \
            Dockerfile

      - name: Open the bump PR
        if: steps.tags.outputs.latest != steps.tags.outputs.current
        uses: peter-evans/create-pull-request@v7
        with:
          branch: chore/makemkv-${{ steps.tags.outputs.latest }}
          commit-message: |
            chore(docker): MakeMKV ${{ steps.tags.outputs.current }} -> ${{ steps.tags.outputs.latest }}
          title: "chore(docker): MakeMKV ${{ steps.tags.outputs.current }} → ${{ steps.tags.outputs.latest }}"
          body: |
            `ghcr.io/jlesage/makemkv` published `${{ steps.tags.outputs.latest }}`.

            **This PR is not verified by CI.** Nothing builds the Dockerfile
            on a `chore/**` branch, and a PR opened by a workflow gets no
            checks at all until a user touches it. Green ticks here — if there
            are any — say nothing about the base image.

            What proves the bump is the Dockerfile's build-time assertion
            (`makemkvcon -r --cache=1 info disc:9999 | grep -q 'MSG:1005.*started'`),
            which shows the transplanted `/opt/makemkv` still resolves its
            bundled loader on `node:26-trixie-slim` — but that runs *after*
            this merges. Build the two-stage transplant by hand first. If it
            fails, the symptom is a loader error on the interpreter or a glibc
            version complaint — **not** a MakeMKV message. Don't "fix" it with
            a glibc compat shim; `ldd` on `/opt/makemkv` is expected to look
            alarming and is not evidence of anything.

            **This is not a beta-key fix.** The key lives in the mounted host
            config, not in the image, and this tag is jlesage's image version,
            not MakeMKV's — a bump can leave the MakeMKV version completely
            unchanged. If the analyser has stopped returning titles, check
            `settings.conf`, not this PR.
