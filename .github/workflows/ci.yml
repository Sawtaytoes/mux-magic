name: CI

on: ["pull_request", "push"]

env:
  PORT: 3000

# Every job carries a `timeout-minutes`. Without one a job inherits GitHub's
# 6-hour ceiling, and a hang is then indistinguishable from a slow queue for
# six hours before it reports `cancelled` — a conclusion that reads like
# infrastructure, not like a failing test.
#
# That is not hypothetical. On 2026-08-14 `unit-tests` hung on a real
# regression (two copies of @charcuterie/logic, so React rendered against two
# copies of its bindings). Both runs for that SHA sat until 03:24 the next
# morning and reported `cancelled`; the same job re-run failed honestly in
# 3m24s. The bug was findable the whole time — the missing timeout is what
# hid it.
#
# The values are ceilings, NOT targets: ~5-7x each job's observed green
# duration (slowest is unit-tests at ~3min, e2e ~2m15s, the rest under a
# minute). They exist to turn a hang into a fast, legible failure, so raise
# one only if a job legitimately grows into it.
#
# The browser install is bounded a SECOND time, at the step, and split in two.
# `playwright install --with-deps` shells out to apt-get, and on 2026-08-19
# GitHub's azure.archive.ubuntu.com mirror stopped answering: every index line
# came back `Ign:`, apt retried forever, and in queuepilot — which had no bound
# anywhere — four runs sat for SIX HOURS before the workflow cap killed them.
# The job ceilings above would cap that at 20 minutes here, but as one opaque
# failed job with nothing naming the half that hung.
#
# So: the apt half is best-effort (ubuntu-latest already ships the libraries
# chromium needs, and a dead Ubuntu mirror must not be able to block this
# repo's CI), and the BROWSER half — Playwright's own CDN, the part the tests
# actually need — runs on its own and must succeed. The repo's
# `install-playwright-browser` script stays the plain `--with-deps` one-liner
# documented in docs/development.md; `timeout` is coreutils and does not exist
# on the Windows side of this fleet, so the bound lives here rather than there.
jobs:
  check-prior-run:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" != "push" ] || [ "$REF" != "refs/heads/master" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          prior=$(gh api \
            "repos/$GH_REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&status=completed" \
            --jq "[.workflow_runs[] | select(.conclusion == \"success\" and .id != $RUN_ID)] | length")
          if [ "$prior" -gt 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Found prior successful CI run for $SHA — skipping jobs (workflow still concludes success)."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: check-prior-run
    if: needs.check-prior-run.outputs.skip != 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: corepack enable && yarn install --immutable
      - run: yarn lint:biome
      - run: yarn lint:eslint

  typecheck:
    needs: check-prior-run
    if: needs.check-prior-run.outputs.skip != 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: corepack enable && yarn install --immutable
      - run: yarn build:tools
      - run: yarn typecheck

  unit-tests:
    needs: check-prior-run
    if: needs.check-prior-run.outputs.skip != 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: corepack enable && yarn install --immutable
      - name: Install chromium
        timeout-minutes: 15
        run: |
          DEBIAN_FRONTEND=noninteractive timeout 300 yarn playwright install-deps chromium \
            || echo "playwright install-deps failed or timed out (apt mirror?) — continuing; the runner image ships chromium's libs"
          timeout 600 yarn playwright install chromium
      - run: yarn build:tools
      # `yarn test` is bare `vitest` so local dev gets watch mode; in CI we
      # need run-once, because Vitest 4 browser mode doesn't reliably exit
      # watch mode just from process.env.CI.
      - run: yarn vitest run

      # AFTER the tests, deliberately: Vite's optimizer writes its metadata
      # as it discovers, so before a run there is nothing to compare and
      # mid-run the picture is incomplete.
      #
      # This guards the exact failure this job hit on 2026-08-15, when
      # `@charcuterie/logic/openapi`, `/query` and `@charcuterie/ui` were
      # all missing from the list: 16 tests died with `Failed to fetch
      # dynamically imported module: …?v=<hash>`, the re-optimization
      # signature, and nothing in the output named the missing packages.
      # An incomplete list passes until it loses the coin flip.
      #
      # The cache lives beside the package, not at the repo root.
      - name: Check optimizeDeps.include parity
        working-directory: packages/web
        run: >-
          yarn charcuterie-check-optimize-deps ./optimizeDeps.js
          --cache-dir node_modules/.vite

  e2e:
    needs: check-prior-run
    if: needs.check-prior-run.outputs.skip != 'true'
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: corepack enable && yarn install --immutable
      - name: Install chromium
        timeout-minutes: 15
        run: |
          DEBIAN_FRONTEND=noninteractive timeout 300 yarn playwright install-deps chromium \
            || echo "playwright install-deps failed or timed out (apt mirror?) — continuing; the runner image ships chromium's libs"
          timeout 600 yarn playwright install chromium
      - run: yarn build:tools
      - run: yarn build:prod
      - run: yarn e2e

  storybook-build:
    # The Storybook build has been broken on EVERY branch of this repo —
    # `master` included — for as long as nine MDX files imported the
    # Storybook 8 `@storybook/blocks` entry point, and nothing here noticed
    # because no job built Storybook.
    #
    # `storybook build` writes `index.json` and `iframe.html` even when it
    # fails partway, so a broken build is byte-indistinguishable from a
    # working one and the output directory is not evidence. The step's exit
    # code is. That is not hypothetical: this repo's entry count was reported
    # as fact out of a build that had exited 1.
    needs: check-prior-run
    if: needs.check-prior-run.outputs.skip != 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: corepack enable && yarn install --immutable
      - run: yarn build:tools
      - run: yarn workspace @mux-magic/web build:storybook

      # The sibling false-green to a partial build is a build that SUCCEEDS
      # with an empty index — a `stories:` glob in `.storybook/main.ts` that
      # stopped matching after a move. Nothing downstream can catch it: a
      # smoke run over zero entries never enters its loop and reports
      # "0 entries rendered clean" as a pass.
      #
      # A FLOOR, not a count. It exists to catch a glob that broke, not to be
      # bumped every time a story is added — 457 entries across 157 files at
      # the time of writing, so 400 is well clear of normal churn and nowhere
      # near zero.
      - name: Assert the Storybook index is not empty
        run: |
          set -euo pipefail
          count="$(node -p "Object.keys(require('./packages/web/storybook-static/index.json').entries).length")"
          echo "Storybook indexed ${count} entries."
          if [ "$count" -lt 400 ]; then
            echo "::error::Storybook indexed ${count} entries (floor is 400) — a stories glob in packages/web/.storybook/main.ts probably stopped matching."
            exit 1
          fi

  build-budget:
    # Worker 79: enforces the BuilderPage modal subtree + yamlCodec stay
    # code-split and that rolldown emits no INEFFECTIVE_DYNAMIC_IMPORT
    # warnings. The test spawns its own `vite build`, so it doesn't
    # depend on prior workflow steps.
    needs: check-prior-run
    if: needs.check-prior-run.outputs.skip != 'true'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    env:
      RUN_BUILD_BUDGET: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with: { node-version: 24 }
      - run: corepack enable && yarn install --immutable
      - run: yarn build:tools
      - run: yarn workspace @mux-magic/web test:build-budget
